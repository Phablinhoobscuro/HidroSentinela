[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hidrosentinela-etl"
version = "0.1.0"
description = "Pipeline ETL do projeto HidroSentinela"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2"
]

[tool.setuptools.packages.find]
where = ["src"]
